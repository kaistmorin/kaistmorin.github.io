---
layout: default
---
{% include media-styles.html %}
<div class="media-detail">
  <a class="archive-back" href="{{ '/media/gallery/' | relative_url }}">← Back to Gallery</a>
  <h1>{{ page.title }}</h1>
  <p class="detail-date">{{ page.date_label }}</p>
  <div class="detail-hero"><img src="{{ '/assets/img/media/gallery/' | append: page.image | relative_url }}" alt="{{ page.title }}"></div>
  <div class="detail-body">{{ content }}</div>
</div>
